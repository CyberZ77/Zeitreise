plugins {
    id 'com.android.application'
}

android {
    namespace 'de.zeitreise.stadtfuehrer'
    compileSdk 35

    defaultConfig {
        applicationId 'de.zeitreise.stadtfuehrer'
        minSdk 26
        targetSdk 34
        versionCode 514
        versionName '0.5.14-test'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
        }
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
}
